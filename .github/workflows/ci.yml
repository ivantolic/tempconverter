name: TempConverter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: tempconverter_test
          MYSQL_USER: tempuser
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit_test.py -v

      - name: Run integration tests
        env:
          DB_USER: tempuser
          DB_PASS: ${{ secrets.MYSQL_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_NAME: tempconverter_test
          STUDENT: Ivan Tolic
          COLLEGE: Algebra Bernays University
        run: python -m pytest tests/integration_test.py -v

      - name: Build Docker image
        run: docker build -t tempconverter:ci .